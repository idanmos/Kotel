apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: com.idanmoshe.Kotel
    intents:
    - metadata:
        name: ShowDirectionIntent_0
        title: Show Direction to Kotel
      corpuses:
        training:
        - locale: de
          utterances:
          - '{${+prefix} }Show me ${+applicationName}'
          - '{${+prefix} }Open ${+applicationName}'
          - '{${+prefix} }Point me to Kotel in ${+applicationName}'
        - locale: ru
          utterances:
          - '{${+prefix} }Show me ${+applicationName}'
          - '{${+prefix} }Open ${+applicationName}'
          - '{${+prefix} }Point me to Kotel in ${+applicationName}'
        - locale: he
          utterances:
          - Show me ${+applicationName}
          - Open ${+applicationName}
          - Point me to Kotel in ${+applicationName}
        - locale: yi
          utterances:
          - Show me ${+applicationName}
          - Open ${+applicationName}
          - Point me to Kotel in ${+applicationName}
        - locale: fr
          utterances:
          - '{${+prefix} }Show me ${+applicationName}'
          - '{${+prefix} }Open ${+applicationName}'
          - '{${+prefix} }Point me to Kotel in ${+applicationName}'
        - locale: es
          utterances:
          - '{${+prefix} }Show me ${+applicationName}'
          - '{${+prefix} }Open ${+applicationName}'
          - '{${+prefix} }Point me to Kotel in ${+applicationName}'
        - locale: pt-BR
          utterances:
          - '{${+prefix} }Show me ${+applicationName}'
          - '{${+prefix} }Open ${+applicationName}'
          - '{${+prefix} }Point me to Kotel in ${+applicationName}'
        - locale: en
          utterances:
          - '{${+prefix} }Show me ${+applicationName}'
          - '{${+prefix} }Open ${+applicationName}'
          - '{${+prefix} }Point me to Kotel in ${+applicationName}'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: de
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
        - locale: ru
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
        - locale: he
          utterances:
          - ${+standardAppShortcutNegatives}
        - locale: yi
          utterances: []
        - locale: fr
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
        - locale: es
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
        - locale: pt-BR
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
